name: Build iOS

# Builds FitFlow for iPhone on a GitHub-hosted Mac, so no Mac is needed locally.
# Run it from the Actions tab ("Run workflow"), push to a branch named ios/*,
# or push a vX.Y.Z tag.
#
# Every run produces two artifacts:
#   fitflow-ios-simulator  App.app zipped, for the iOS Simulator or appetize.io
#   fitflow-ios-unsigned   an UNSIGNED .ipa; Sideloadly (Windows) can sign it with a
#                          free Apple ID and install it on a real iPhone (7-day expiry)
#
# If the four App Store Connect secrets below exist, the run ALSO archives a
# properly signed build and uploads it to TestFlight (needs the paid Apple
# Developer Program, $99/yr):
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contents of the .p8), APPLE_TEAM_ID
#
# Required secret: GOOGLE_SERVICE_INFO_PLIST (base64 of ios/App/App/GoogleService-Info.plist).
# Without it Firebase cannot start and the app closes on launch.

on:
  workflow_dispatch: {}
  push:
    branches: [ 'ios/**' ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve version
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Write .env from secrets
        env:
          VITE_GEMINI_PROXY_URL: ${{ secrets.VITE_GEMINI_PROXY_URL }}
          VITE_USDA_API_KEY: ${{ secrets.VITE_USDA_API_KEY }}
        run: |
          : > .env
          [ -n "$VITE_GEMINI_PROXY_URL" ] && echo "VITE_GEMINI_PROXY_URL=$VITE_GEMINI_PROXY_URL" >> .env
          [ -n "$VITE_USDA_API_KEY" ] && echo "VITE_USDA_API_KEY=$VITE_USDA_API_KEY" >> .env
          true

      # No VITE_STRIPE_* here on purpose: App Store Guideline 3.1.1 forbids
      # external checkout for digital goods. Purchases on iOS go through
      # RevenueCat/StoreKit once VITE_REVENUECAT_IOS_KEY exists.
      - name: Build web assets
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_ALL_FEATURES_FREE: ${{ secrets.VITE_ALL_FEATURES_FREE }}
          VITE_APP_VERSION: ${{ env.RELEASE_TAG }}
          VITE_APP_ENV: production
          VITE_NATIVE_SHELL: 'true'
        run: npm run build

      # Regenerates CapApp-SPM/Package.swift with macOS paths (the committed
      # one was written on Windows and has backslash paths).
      - name: Sync Capacitor → iOS
        run: |
          npx cap sync ios
          # SwiftPM names a local package after its folder: the plugin's
          # "app-check" folder collides with google/app-check (needed by
          # GoogleSignIn). Point at a uniquely named copy instead.
          cp -R node_modules/@capacitor-firebase/app-check node_modules/@capacitor-firebase/capacitor-firebase-app-check
          sed -i '' 's#@capacitor-firebase/app-check"#@capacitor-firebase/capacitor-firebase-app-check"#' ios/App/CapApp-SPM/Package.swift
          grep -n app-check ios/App/CapApp-SPM/Package.swift

      - name: Write GoogleService-Info.plist
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$PLIST_B64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST secret missing; the app would crash on launch"; exit 1
          fi
          echo "$PLIST_B64" | base64 -D > ios/App/App/GoogleService-Info.plist

      # Adds the privacy manifest + Firebase plist to the App target's
      # resources (they exist on disk; App Store rejects a missing manifest).
      - name: Add resource files to the App target
        run: |
          sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group.find_subpath("App", false)
            %w[PrivacyInfo.xcprivacy GoogleService-Info.plist].each do |f|
              next if t.resources_build_phase.files_references.any? { |r| r && r.path == f }
              t.add_resources([g.new_reference(f)]); puts "added #{f}"
            end
            p.save'

      - name: Build for Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -40
          cd build/sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/fitflow-ios-simulator.zip" App.app

      - name: Build unsigned device IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "fitflow-${RELEASE_TAG}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: fitflow-ios-simulator
          path: fitflow-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fitflow-ios-unsigned
          path: fitflow-*-unsigned.ipa

      - name: Archive + upload to TestFlight (only with App Store Connect secrets)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "App Store Connect secrets not set: skipping signed TestFlight build."; exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FitFlow.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive | tail -40
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FitFlow.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}"
          echo "Uploaded to App Store Connect; it appears in TestFlight after processing."
