<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: in the Android app, Capacitor's SystemBars then pads
         the WebView by the real system-bar sizes (Android 15+ forces edge-to-edge and
         env(safe-area-inset-*) is NOT reliable in WebViews — the white nav bar was
         covering the bottom dock). Browsers/PWA handle safe areas themselves. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#06070A" />
    <!-- Warm up the TLS handshakes the app needs immediately after boot. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <!-- AI + billing: proxy/checkout functions (web) and direct Gemini (APK). -->
    <link rel="preconnect" href="https://us-central1-gen-lang-client-0893216108.cloudfunctions.net" crossorigin />
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="FitFlow — Train smarter. Move farther. AI-personalized workouts, nutrition, recovery, and community in one app." />
    <link rel="canonical" href="https://fitflow.com/" />
    <meta property="og:url" content="https://fitflow.com/" />
    <meta property="og:site_name" content="FitFlow" />
    <meta property="og:title" content="FitFlow — Train smarter. Move farther." />
    <meta property="og:description" content="The all-in-one AI fitness platform: workouts, nutrition, recovery, social. Built to replace the rest." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fitflow.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitFlow — Train smarter. Move farther." />
    <meta name="twitter:description" content="AI form check, live coaching, weekly recap, unified wearable sync." />
    <meta name="twitter:image" content="https://fitflow.com/og-image.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts must never block first paint. A plain <link rel="stylesheet"> to a
         third-party origin holds the render tree hostage to someone else's DNS +
         TLS + response time; on a cold mobile connection that alone was costing
         us most of a second before a single pixel appeared. Loading it as a
         print stylesheet and flipping to `all` on load makes it non-blocking,
         and font-display:swap (already in the URL) covers the swap-in. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <!-- Google Identity Services is loaded on demand by GoogleSignInButton, not
         here: it is ~80 kB plus a third-party connection that only the signed-out
         login screen ever needs.

         The connection is still warmed up front. Fetching on demand means the
         request starts only once auth has resolved, and without this the sign-in
         button paid for a cold DNS + TLS handshake at exactly that moment —
         which handed back a chunk of what deferring the script won. preconnect
         costs a socket, not 80 kB. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <title>FitFlow — Train smarter. Move farther.</title>
    <!-- Theme, applied BEFORE first paint.
         This is deliberately a blocking inline script rather than something
         React does on mount: any later and every cold start flashes the light
         background at dark-mode users before the app hydrates. The storage key
         and the resolution rule are mirrored in src/hooks/useTheme.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ff-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#04060A' : '#F4F6FB');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Instant shell.
         Everything below is inline HTML + inline CSS, so first paint happens on
         the very first response and never waits for React, Firebase or fonts to
         download and parse. main.tsx removes it once the app has mounted. -->
    <style>
      #ff-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #06070a;
        background-image:
          radial-gradient(circle at 10% 0%, rgba(198, 255, 61, 0.06) 0%, transparent 45%),
          radial-gradient(circle at 100% 100%, rgba(125, 211, 252, 0.04) 0%, transparent 45%);
        z-index: 9999;
        /* System stack only — a webfont here would defeat the point. */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 220ms ease-out;
      }
      #ff-splash[data-leaving="true"] { opacity: 0; }
      /* The splash is painted before any stylesheet loads, so it needs its own
         light variant or the flash simply moves from the app into the splash. */
      html[data-theme="light"] #ff-splash {
        background: #f4f6fb;
        background-image:
          radial-gradient(circle at 10% 0%, rgba(132, 168, 0, 0.10) 0%, transparent 45%),
          radial-gradient(circle at 100% 100%, rgba(0, 140, 160, 0.07) 0%, transparent 45%);
      }
      html[data-theme="light"] #ff-splash h1 { color: #0b1220; }
      #ff-splash h1 {
        margin: 0;
        color: #fff;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      #ff-splash p {
        margin: 0;
        color: #8b92a3;
        font-size: 14px;
        font-weight: 500;
      }
      #ff-splash .ff-bar {
        width: 128px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #ff-splash .ff-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #c6ff3d;
        animation: ff-slide 1.1s ease-in-out infinite;
      }
      @keyframes ff-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ff-splash .ff-bar i { animation: none; width: 100%; }
        #ff-splash { transition: none; }
      }
    </style>
    <div id="ff-splash" role="status" aria-live="polite">
      <svg width="52" height="52" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="13" fill="#C6FF3D" />
        <path
          d="M12 30c4-10 8-10 12 0s8 10 12 0"
          stroke="#06070A"
          stroke-width="4.5"
          stroke-linecap="round"
          fill="none"
        />
      </svg>
      <h1>FitFlow</h1>
      <p>Train smarter. Move farther.</p>
      <span class="ff-bar" aria-hidden="true"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
