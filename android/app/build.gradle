apply plugin: 'com.android.application'

// Load release signing config from keystore.properties (gitignored)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.fitflow.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fitflow.fitness"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "1.6.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // Minification is OFF for the v1.2.x test-track builds. R8 was stripping
            // the reflection-loaded RevenueCat/Capacitor plugin classes (added after
            // v1.0.0), which crashed the app on launch ("won't open"). proguard-rules.pro
            // now has the correct keep rules, so this can be flipped back to `true`
            // once a minified build is verified opening on a real device.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', '**/kotlin/**']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Sleep (health/SleepPlugin.java). Same connect-client version that
    // capacitor-health-connect ships, so there is one copy at runtime.
    implementation "androidx.health.connect:connect-client:1.1.0-alpha02"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // In-app review (review/ReviewPlugin.java). The split Play library: it
    // brings play:core-common + play-services-tasks, and nothing in this app
    // pulls in the old monolithic com.google.android.play:core, whose classes
    // would clash with core-common.
    implementation "com.google.android.play:review:2.0.2"
}

apply from: 'capacitor.build.gradle'

// google-services.json carries the Firebase app id and sender id. Without it
// the native Firebase app never starts: Google sign-in fails and no push is
// ever received. The file is gitignored, so a fresh clone or a new worktree
// does not have it — and this block used to log at INFO level and carry on.
// v1.6.5 and v1.6.6 were built that way and shipped with neither feature.
//
// A release build now refuses to start without it. Debug builds still may.
def servicesJSON = file('google-services.json')
def buildingRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
} else if (buildingRelease) {
    throw new GradleException(
        "android/app/google-services.json is missing. A release built without it has no " +
        "Google sign-in and no push notifications. Copy it from the main checkout " +
        "(it is gitignored) or restore it from the GOOGLE_SERVICES_JSON secret.")
} else {
    logger.warn("google-services.json not found: this DEBUG build has no Google sign-in and no push.")
}
